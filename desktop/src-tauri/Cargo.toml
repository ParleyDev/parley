[package]
name = "parley-desktop"
version = "0.1.0"
description = "Parley for Windows, macOS and Linux"
edition = "2021"
publish = false

[lib]
name = "parley_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"
serde_json = "1"
