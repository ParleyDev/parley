<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Parley</title>
    <!-- Installable web app: the manifest's scope is the whole site, so an iPhone or Android home-screen icon keeps
         every page in the app instead of opening some in a browser sheet. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0c10" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parley" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Not render-blocking: on a phone waking up with a slow or half-up network, a stalled font request would otherwise
         keep the whole page blank until it times out. The system font shows until Inter arrives. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Dark from the first paint (the app's styles load with the bundle), so nothing flashes or sits white. -->
    <style>html, body { background: #0b0c10; color: #dbdee1; margin: 0; } #boot-stuck { display: none; } html.boot-stuck #boot-stuck { display: flex; }</style>
    <!-- Start-up watchdog (first in the page, before the bundle's script and stylesheet, so it hears them failing): the
         app replaces #boot-stuck when it renders. If it hasn't after a while (start-up threw before the first render),
         offer a reload instead of a blank screen. If the bundle or its stylesheet failed to load (a phone waking up
         with a page from before a deploy, whose files the server no longer has), load the current build: once a
         minute at most, then offer the reload. Without this the app starts unstyled. -->
    <script>
      (function () {
        var show = function () { document.documentElement.classList.add('boot-stuck') }
        setTimeout(show, 10000)
        var failed = function () {
          try {
            if (Date.now() - Number(sessionStorage.getItem('parley.bootReload') || 0) < 60000) return show()
            sessionStorage.setItem('parley.bootReload', String(Date.now()))
          } catch (_) { return show() }
          location.reload()
        }
        addEventListener('error', function (e) {
          var t = e.target
          if (t && ((t.tagName === 'SCRIPT' && t.type === 'module') || (t.tagName === 'LINK' && t.rel === 'stylesheet' && /\/assets\//.test(t.href)))) failed()
        }, true)
      })()
    </script>
  </head>
  <body>
    <div id="root"><div id="boot-stuck" style="height:100vh;align-items:center;justify-content:center;text-align:center;font:15px system-ui,-apple-system,sans-serif;padding:24px"><div><div style="font-size:17px;font-weight:600;margin-bottom:6px">Parley didn't start</div><div style="opacity:.7;margin-bottom:16px">The connection may have dropped while it was loading.</div><button onclick="location.reload()" style="font:inherit;font-weight:600;background:#5865f2;color:#fff;border:0;border-radius:8px;padding:10px 22px">Reload</button></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
