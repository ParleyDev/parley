services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parley
      POSTGRES_PASSWORD: parley
      POSTGRES_DB: parley
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parley -d parley"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://parley:parley@db:5432/parley
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      # JSON array of RTCIceServer objects; add a TURN server for users behind strict NATs.
      ICE_SERVERS: ${ICE_SERVERS:-[{"urls":"stun:stun.l.google.com:19302"}]}
      UPLOAD_DIR: /data/uploads
      # Per-user storage quota for attachments and profile images, in bytes (0 = unlimited; admins can override per user).
      UPLOAD_QUOTA_BYTES: ${UPLOAD_QUOTA_BYTES:-1073741824}
      # GIF picker: set one of these (Tenor is preferred). Without a key the GIF tab explains how to enable it.
      TENOR_API_KEY: ${TENOR_API_KEY:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      # Comma-separated emails of Parley admins (they approve Discover submissions).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Rate limits as count/seconds. Built-in defaults (register 20/60 per IP, login 30/60 per IP,
      # failed logins 5/60 per IP, messages 10/5 per user, uploads 30/60, GIF proxy 60/60) suit
      # production; the compose defaults below are looser so local development and the e2e suites
      # (which register many accounts from one IP) are not throttled. Tighten them in .env.
      RL_REGISTER: ${RL_REGISTER:-500/60}
      RL_LOGIN: ${RL_LOGIN:-500/60}
      RL_LOGIN_FAIL: ${RL_LOGIN_FAIL:-5/60}
      RL_MESSAGES: ${RL_MESSAGES:-60/5}
      RL_UPLOADS: ${RL_UPLOADS:-120/60}
      RL_GIFS: ${RL_GIFS:-60/60}
      RL_MAIL: ${RL_MAIL:-100/600}
      # Email: MAIL_MODE=smtp with SMTP_URL (smtp://user:pass@host:587?tls=required) sends real mail;
      # `log` (default) prints mails to the backend log; admins can always read the last ones via
      # GET /admin/mail. APP_URL is the public base used in emailed links.
      MAIL_MODE: ${MAIL_MODE:-log}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Parley <no-reply@parley.local>}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Link previews never fetch private/loopback addresses. The compose network is pinned so the
      # host's gateway address is known; the e2e suites serve test pages there. Leave empty in production.
      EMBED_ALLOW_HOSTS: ${EMBED_ALLOW_HOSTS:-172.30.0.1}
      # Observability: GET /metrics (Prometheus text) on the backend port, guarded by METRICS_TOKEN when set;
      # LOG_FORMAT=json for structured logs; SENTRY_DSN enables error/panic reporting.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-18080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Public hostname: CN / SAN for the self-signed cert, and the Let's Encrypt domain when that profile is on.
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
    volumes:
      # Drop real cert.pem / key.pem here to replace the self-signed one (or use the letsencrypt profile below).
      - certs:/etc/nginx/certs
      - letsencrypt:/etc/letsencrypt:ro
      - acme:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "${WEB_PORT:-3000}:80"
      - "${WEB_TLS_PORT:-3443}:443"

  # Second backend instance for testing horizontal scaling (profile "cluster"): same image, same DB and
  # uploads, reachable on API_PORT2 (18081). Instances share events and presence through Postgres
  # LISTEN/NOTIFY; put a load balancer in front for real deployments (voice needs sticky sessions).
  backend2:
    extends:
      service: backend
    profiles: ["cluster"]
    ports: !override
      - "${API_PORT2:-18081}:8080"

  # Backups: `docker compose --profile backup run --rm backup once` for a single backup into ./backups, or
  # `docker compose --profile backup up -d` to keep one running daily (BACKUP_INTERVAL seconds, BACKUP_KEEP of each).
  # Restore drill: ops/restore.sh backups/db-<ts>.dump backups/uploads-<ts>.tgz (see README).
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: parley
      PGPASSWORD: parley
      PGDATABASE: parley
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - uploads:/data/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/backup.sh:/ops/backup.sh:ro
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    command: ["loop"]

  # Real TLS from Let's Encrypt: `docker compose --profile letsencrypt up -d` with TLS_HOSTNAME=chat.example.com,
  # LETSENCRYPT_EMAIL=you@example.com and WEB_PORT=80 (the HTTP-01 challenge must reach port 80 on that name).
  # Issues on first start, renews twice a day; the frontend picks up renewals and reloads nginx by itself.
  certbot:
    image: certbot/certbot:latest
    profiles: ["letsencrypt"]
    depends_on:
      - frontend
    environment:
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        STAGING=""; [ "$$LETSENCRYPT_STAGING" = "1" ] && STAGING="--staging"
        certbot certonly --webroot -w /var/www/certbot -d "$$TLS_HOSTNAME" --email "$$LETSENCRYPT_EMAIL" --agree-tos --no-eff-email --non-interactive --keep-until-expiring $$STAGING
        while :; do sleep 12h; certbot renew --webroot -w /var/www/certbot --quiet $$STAGING || true; done

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  pgdata:
  uploads:
  certs:
  letsencrypt:
  acme:
