services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: y99
      POSTGRES_PASSWORD: y99
      POSTGRES_DB: y99
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U y99 -d y99"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://y99:y99@db:5432/y99
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-18080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
