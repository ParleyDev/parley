name: desktop
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
        working-directory: desktop
      - name: Generate icons
        run: npx tauri icon assets/icon.png
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          # Installers: .msi + .exe (Windows), .dmg + .app (macOS), .AppImage + .deb (Linux)
          args: ''
      - uses: actions/upload-artifact@v4
        with:
          name: parley-desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
