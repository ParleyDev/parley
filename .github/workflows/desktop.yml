name: desktop
on:
  # Publishing a GitHub release (including pre-releases) builds it; the gate job checks the tag is semver.
  release:
    types: [published]
  workflow_dispatch:
jobs:
  # Releases build only for semver tags (v1.2.3, 1.2.3, v2.0.0-rc.1, v1.2.3+build.5); manual runs always build.
  # The tag becomes the version of every artifact (scripts/version.mjs, PARLEY_VERSION).
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" != "release" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          SEMVER='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if printf '%s' "$TAG" | grep -qE "$SEMVER"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Release $TAG: building version ${TAG#v}"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Release tag '$TAG' is not semver (e.g. v1.2.3); skipping build"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    env:
      PARLEY_VERSION: ${{ needs.gate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      # Full history and tags: scripts/version.mjs counts commits and detects release tags.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: Compute version
        id: ver
        shell: bash
        run: echo "display=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT" && node scripts/version.mjs --apply
      - run: npm ci
        working-directory: desktop
      - name: Generate icons
        run: npx tauri icon assets/icon.png
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          # Installers: .msi + .exe (Windows), .dmg + .app (macOS), .AppImage + .deb + .rpm (Linux)
          args: ''
      - uses: actions/upload-artifact@v4
        with:
          name: parley-desktop-${{ matrix.name }}-${{ steps.ver.outputs.display }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
