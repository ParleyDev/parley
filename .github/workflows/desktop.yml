name: desktop
on:
  # Every change to the desktop app on main: a development build (0.21.0-pre.13) on the rolling `dev` prerelease,
  # which the app's Development update channel follows (scripts/dev-release.sh). A newer push cancels a running one.
  push:
    branches: [main]
    paths: ['desktop/**', 'scripts/version.mjs', 'scripts/dev-release.sh', 'VERSION', '.github/workflows/desktop.yml']
  # Publishing a GitHub release (including pre-releases) builds it; the gate job checks the tag is semver.
  release:
    types: [published]
  # By hand: leave the tag blank for a development build, or give an existing release's tag (v1.4.0) to build that
  # tag's code and attach the files to the release (for releases published before this workflow could, or re-runs).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to (blank = development build)
        required: false
        default: ''
# Attaching build outputs to the GitHub release needs write access to repository contents.
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.event_name == 'push' && 'dev' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  # Releases build only for semver tags (v1.2.3, 1.2.3, v2.0.0-rc.1, v1.2.3+build.5); manual runs without a tag
  # always build. The tag becomes the version of every artifact (scripts/version.mjs, PARLEY_VERSION), the code
  # that is built, and the release the files are attached to.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with: { fetch-depth: 0 }
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # A push to main: the development build. Release commits are built by their release instead.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$MSG" in "Release "*|"chore(release): "*) echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Release commit: the release builds it"; exit 0 ;; esac
            v=$(node scripts/version.mjs --version)
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tag=dev" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            scripts/dev-release.sh prepare "$v"
            exit 0
          fi
          if [ -z "$TAG" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::No GitHub release with tag '$TAG'"; exit 1; fi
          SEMVER='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if printf '%s' "$TAG" | grep -qE "$SEMVER"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "Release $TAG: building version ${TAG#v}"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Release tag '$TAG' is not semver (e.g. v1.2.3); skipping build"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    env:
      PARLEY_VERSION: ${{ needs.gate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      # Full history and tags: scripts/version.mjs counts commits and detects release tags.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ needs.gate.outputs.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: Compute version
        id: ver
        shell: bash
        run: echo "display=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT" && node scripts/version.mjs --apply
      - run: npm ci
        working-directory: desktop
      - name: Generate icons
        run: npx tauri icon assets/icon.png
        working-directory: desktop
      # Signs the update bundles (createUpdaterArtifacts) with the key whose public half is in tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # Installers: .msi + .exe (Windows), .dmg + .app (macOS), .AppImage + .deb + .rpm (Linux)
          args: ''
      - uses: actions/upload-artifact@v4
        with:
          name: parley-desktop-${{ matrix.name }}-${{ steps.ver.outputs.display }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: warn
      # Published release: attach this platform's installers to it (re-runs replace them).
      - name: Attach installers to the release
        if: needs.gate.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          shopt -s nullglob
          b=desktop/src-tauri/target/release/bundle
          files=($b/msi/*.msi $b/nsis/*.exe $b/dmg/*.dmg $b/appimage/*.AppImage $b/deb/*.deb $b/rpm/*.rpm)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no installers were built"; exit 1; fi
          # Update bundles and their signatures, for latest.json (the manifest job).
          files+=($b/macos/*.app.tar.gz $b/*/*.sig)
          printf 'attaching %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
  # The app updater's manifest (desktop/src-tauri/tauri.conf.json → plugins.updater reads
  # releases/latest/download/latest.json): the version, notes and, per platform, the signed bundle and its signature.
  # Linux updates the AppImage, macOS the .app.tar.gz, Windows runs the NSIS installer.
  manifest:
    needs: [gate, build]
    if: needs.gate.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.gate.outputs.ref }}" }
      # The rolling dev prerelease: drop the previous build's installers first, so only this build's are left.
      - name: Remove the previous development build
        if: needs.gate.outputs.tag == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/dev-release.sh prune '\.(msi|exe|dmg|AppImage|deb|rpm|sig|app\.tar\.gz)$'
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() { [ -f "$2.sig" ] && jq -n --arg k "$1" --arg sig "$(cat "$2.sig")" --arg url "$base/$2" '{($k): {signature: $sig, url: $url}}' || echo '{}'; }
          exe=$(ls *-setup.exe.sig 2>/dev/null | head -1); exe=${exe%.sig}
          app=$(ls *.app.tar.gz.sig 2>/dev/null | head -1); app=${app%.sig}
          img=$(ls *.AppImage.sig 2>/dev/null | head -1); img=${img%.sig}
          platforms=$(jq -s 'add' <(entry windows-x86_64 "$exe") <(entry darwin-aarch64 "$app") <(entry linux-x86_64 "$img"))
          if [ "$platforms" = '{}' ]; then echo "::error::no signed update bundles on the release (is TAURI_SIGNING_PRIVATE_KEY set?)"; exit 1; fi
          rel=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,publishedAt)
          jq -n --arg v "$VERSION" --argjson rel "$rel" --argjson p "$platforms" \
            '{version: $v, notes: ($rel.body // "" | .[0:4000]), pub_date: $rel.publishedAt, platforms: $p}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
