name: mobile
on:
  # Publishing a GitHub release (including pre-releases) builds it; the gate job checks the tag is semver.
  release:
    types: [published]
  # By hand: leave the tag blank for a development build, or give an existing release's tag (v1.4.0) to build that
  # tag's code and attach the files to the release (for releases published before this workflow could, or re-runs).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach to (blank = development build)
        required: false
        default: ''
      upload:
        description: Also send a development build to Play internal testing and TestFlight
        type: boolean
        required: false
        default: false
# Attaching build outputs to the GitHub release needs write access to repository contents.
permissions:
  contents: write
jobs:
  # Releases build only for semver tags (v1.2.3, 1.2.3, v2.0.0-rc.1, v1.2.3+build.5); manual runs without a tag
  # always build. The tag becomes the version of every artifact (scripts/version.mjs, PARLEY_VERSION), the code
  # that is built, and the release the files are attached to.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      # Releases always go to the testers' tracks; development builds only when asked.
      upload: ${{ steps.check.outputs.tag != '' || inputs.upload == true }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::No GitHub release with tag '$TAG'"; exit 1; fi
          SEMVER='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if printf '%s' "$TAG" | grep -qE "$SEMVER"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Release $TAG: building version ${TAG#v}"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Release tag '$TAG' is not semver (e.g. v1.2.3); skipping build"
          fi
  # Android: with the Play upload key in secrets (ANDROID_KEYSTORE = the .jks base64, ANDROID_KEYSTORE_PASSWORD,
  # optional ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD) the build is release-signed: an AAB for Play and an APK for
  # sideloading. With PLAY_SERVICE_ACCOUNT_JSON too, the AAB goes to the Play internal testing track; promoting it
  # to production stays a manual step in Play Console. Without the key it falls back to a debug APK.
  android:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    env:
      PARLEY_VERSION: ${{ needs.gate.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: scripts/version.mjs counts commits and detects release tags.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ needs.gate.outputs.tag }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 } # Capacitor 8 compiles for Java 21
      # The obsolete "tools" package (the action's default) no longer exists in current cmdline-tools.
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Compute version
        id: ver
        run: echo "display=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT" && node scripts/version.mjs --apply
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      # Optional push support: put the Firebase config in a repository secret.
      - run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json; fi
        working-directory: mobile
      - name: Upload key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::notice::No ANDROID_KEYSTORE secret; building a debug APK"; exit 0; fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Without an alias secret, use the keystore's only key.
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASSWORD" | awk -F, '/PrivateKeyEntry/ {print $1; exit}'); fi
          {
            echo "PARLEY_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "PARLEY_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "PARLEY_KEY_ALIAS=$KEY_ALIAS"
            echo "PARLEY_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "play=$([ -n "$PLAY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            ./gradlew bundleRelease assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/parley.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/parley.aab"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/parley.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: parley-android-${{ steps.ver.outputs.display }}
          path: |
            ${{ runner.temp }}/parley.apk
            ${{ runner.temp }}/parley.aab
          if-no-files-found: ignore
      - name: Attach the APK to the release
        if: needs.gate.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          apk="Parley_${PARLEY_VERSION}_android.apk"
          cp "$RUNNER_TEMP/parley.apk" "$apk"
          gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
      # A Play app that has never been published only takes draft releases: set the repository variable
      # PLAY_RELEASE_STATUS=draft until the first review, then remove it.
      - name: Send to Play internal testing
        if: needs.gate.outputs.upload == 'true' && steps.key.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.runparley.app
          releaseFiles: ${{ runner.temp }}/parley.aab
          releaseName: ${{ steps.ver.outputs.display }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
  # iOS: with an App Store Connect API key in secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 = the .p8 file's
  # contents, base64) and APPLE_TEAM_ID, Xcode signs in the cloud (certificate and profile are created on demand)
  # and the archive is uploaded to App Store Connect for TestFlight. The key needs the Admin role so it can manage
  # signing. Without the key it only proves the project compiles with an unsigned simulator build.
  ios:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    env:
      PARLEY_VERSION: ${{ needs.gate.outputs.version }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ needs.gate.outputs.tag }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/version.mjs --apply
      - run: npm ci
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile
      - name: App Store Connect key
        id: key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$TEAM" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::notice::No App Store Connect key; simulator build only"; exit 0; fi
          printf '%s' "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Capacitor 8 uses Swift Package Manager (ios/App/CapApp-SPM), not CocoaPods: build the project directly.
      - name: Simulator build
        if: steps.key.outputs.signed != 'true'
        working-directory: mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Archive
        if: steps.key.outputs.signed == 'true'
        working-directory: mobile/ios/App
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Parley.xcarchive" "${auth[@]}" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic archive
          cp ../ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$TEAM" "$RUNNER_TEMP/ExportOptions.plist"
          # The upload destination exports and uploads in one go; otherwise export an IPA to keep as an artifact.
          if [ "${{ needs.gate.outputs.upload }}" != true ]; then plutil -replace destination -string export "$RUNNER_TEMP/ExportOptions.plist"; fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Parley.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: parley-ios-${{ env.PARLEY_VERSION || github.sha }}
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
