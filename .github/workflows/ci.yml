name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend typecheck & lint
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx oxlint src
      - run: npm run build

  backend-check:
    name: Backend build & tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo build --locked
      - run: cargo test --locked

  e2e:
    name: End-to-end (docker compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADMIN_EMAILS: admin-e2e@x.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Start the stack (fresh volumes, migrations run on boot)
        run: docker compose up -d
      - name: Wait for backend and frontend
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:18080/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -fs http://localhost:3000/healthz && break; sleep 2; done
          curl -fs http://localhost:18080/health
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the suites
        run: npm run e2e
      - name: Backup smoke test (pg_dump + uploads tarball)
        run: |
          docker compose --profile backup run --rm backup once
          ls -lh backups/ && test -s backups/db-*.dump && test -s backups/uploads-*.tgz
        working-directory: frontend
      - name: Backend logs
        if: failure()
        run: docker compose logs backend --tail 300
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/e2e/out/*.png
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down -v
